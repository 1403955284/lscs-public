# 规则建议的可调数值（M2 设计文档第 5 节）。

[curve]          # 回合 = 目标酒馆等级（新手标准节奏）
2 = 2
4 = 3
6 = 4
8 = 5
10 = 6

[health]
greedy_at = 30   # 有效血量（血量 + 护甲）≥ 此值：节奏表提前一回合
safe_below = 15  # 有效血量 ≤ 此值：升本排在买牌之后

[buy_cost]
default = 3

[buy_cost.heroes]  # 英雄卡牌 ID（去掉 _SKIN_* 后缀）= 买牌价，只填和默认不同的英雄
TB_BaconShop_HERO_49 = 2  # 米尔豪斯·法力风暴：英雄技能"购买随从和刷新的消耗改为（2）"

[score]          # 身材分里的固定加分
keyword = 2      # 每个关键词（圣盾、复生、剧毒、烈毒、风怒、嘲讽、潜行）
tribe = 2        # 属于主力种族
spell = 1        # 酒馆法术的固定分（规则建议不买法术）
