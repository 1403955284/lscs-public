# lscs 本地配置模板。复制为 config.toml 后填写（config.toml 已加入 .gitignore，不会进入仓库）。

[llm]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
base_url = ""                  # 留空表示 https://api.deepseek.com
api_key = ""                   # 你的 DeepSeek Key
# 快速建议：招募开始和每次刷新后各一次，2~3 秒出结果
thinking = "disabled"          # 请保持 disabled；思考交给下面的深度分析
timeout_seconds = 20
max_output_tokens = 1500
max_calls_per_game = 100       # 每局最多调用几次（快速、深度、选英雄和选项一起算，改正也算）
hero_advice = true             # 选英雄时也让 AI 推荐一个（每局 1 次，重随时再 1 次）
choice_advice = true           # 弹出选项（三连发现、黑暗之赐、饰品、技能升级）时让 AI 选一个
repair_invalid = true          # AI 的方案不合法时把原因发回去让它改正一次（多等约 2 秒、多一次调用）
all_opponents = true           # 把所有对手的阵容摘要发给 AI（关掉只写下一个对手）
comp_guide = true              # 把本赛季流派指南里和本局种族有关的流派发给 AI（strategy/current/comps.md）
game_plan = true               # 让深度分析定下整局计划（目标流派、核心卡、升本节奏），快速建议和面板跟着它走
# 深度分析：每回合开始时和快速建议同时发出，开思考，约 20 秒（偶尔 1 分钟）出结果
deep_analysis = true           # false 关闭深度分析（每局大约省 5 毛到 1 块钱）
deep_thinking = "low"          # 思考强度：low 或 high（high 更慢）
deep_max_output_tokens = 16000
deep_timeout_seconds = 75

[overlay]
enabled = true                 # 游戏上的悬浮面板；false 只用终端（也可以用 lscs watch --no-overlay）
position = "right"             # 贴在炉石窗口的 right（右下角）、left（左下角）或 top（顶部）；拖过面板后以拖到的位置为准
opacity = 0.85                 # 不透明度，0.3~1.0
font_size = 0                  # 字号（像素）：0 表示按炉石窗口大小自动（1440p 下约 20），或填 10~40
click_through = true           # 鼠标点击穿透面板，不影响游戏操作（只在 Windows 上有效）
drag_handle = true             # 面板右上角的"≡ 拖动"标签；点它时炉石被切到后台就改成 false（面板留在默认或上次拖到的位置）
opponents = true               # 面板上写对手：战斗中一行"最强"（详细模式还写招募时的下个对手、战斗中的对手一览）
detail = false                 # 面板默认只写"下一步"和一两行要点；true 改成分区的详细模式（本回合的每一步、要找、对子、对手）

[review]
# 对局复盘：每局打完挑出最要紧的 2~3 个时刻和"下局重点"；uv run lscs review <日志> 也能给录像出复盘，
# uv run lscs review --habits 看最近几局的习惯
enabled = true                 # 每局打完自动复盘（终端、面板和 reviews/ 里的文件）
ai = true                      # 让 AI 把复盘写成一段话（每局 1 次调用，不到 2 分钱；false 只用规则版）
dir = "reviews"                # 复盘文件和历史记录存在哪（相对项目目录）
history_games = 10             # "最近 N 局"看几局（3~50）

[positioning]
# 站位建议：买完牌后提示把哪个随从拖到最左 / 最右（战斗型亡语、进击放最左，复仇放最右……），
# 附一句为什么。纯规则，不调用 AI；没有卡牌数据时不提示
enabled = true                 # false 关闭

[combat_result]
# 战斗一开始就在棋盘顶部（和终端）显示这场的真实结果：赢 / 输 / 平、掉几血。
# 日志比画面快几十秒，这是真实结果不是预测；不想被剧透就改成 false（终端的"战斗结束"那一行
# 也不写打完以后的血量。面板上对手的血量、名次一直跟着日志走，关掉也会比画面早变）
enabled = true

[stats]
# 本版本统计（可选）：选英雄、选饰品时显示每个选项在当前版本的平均名次和被选率，也发给 AI。
# 数据来自 Firestone（第三方、非官方），每个文件每天最多下载一次；默认关闭，只给自己用时改成 true
enabled = false
mmr_percentile = 100           # 看哪个分段的数据：100 全部玩家，50 / 25 / 10 / 1 是前 N% 的玩家（6000 分以下用 100）
period = "last-patch"          # "last-patch" 本补丁；"past-seven" 最近 7 天（补丁刚更新、数据还少时可以用）
cards = true                   # 把本版本战绩好的随从发给 AI（只给 AI，面板上不显示）；false 不下载随从数据

[guides]
# 流派指南自动更新（可选）：每天最多从 HSReplay 下载一次公开的流派指南（约 35 KB），只用当前补丁
# 更新过的条目，卡名换成中文后代替 strategy/current/comps.md 的流派发给 AI，也用来标商店里的核心卡。
# 数据来自 HSReplay（第三方、非官方、没有正式授权）；默认关闭，只给自己用时改成 true
enabled = false
patch_date = "2026-10-01"       # 当前补丁的上线日期；换了补丁（比如 10 月 21 日新扩展包）改成新日期

[highlight]
# 游戏画面上的高亮：在"下一步"指的那张牌或按钮的四个角画浅金色的括号（只在 Windows 上显示）；
# 商店里的核心卡左上角另画一个粉红的"核"字小徽章（core_marks）。
# 商店、场面、四个按钮和饰品（4 个选项）都按截图校准过；3 个选项和选英雄两排还是估计的。
# 对不准时用 uv run lscs highlight-test 对照截图再校准。
# x 是内容区宽度的比例，y 和尺寸是内容区高度的比例（内容区：客户区里居中的最大 16:9 矩形）。
enabled = true                 # false 只关高亮，面板的"下一步"照常
color = "#f2d98a"              # 框的颜色（浅金）
style = "corners"              # "corners" 只画四个角；"frame" 画整圈细线框
pulse = true                   # 换到新的目标时框闪 3 下（约 1 秒）；false 不闪
aspect = 1.7777777777777777    # 内容区的宽高比（16:9）
# 一排牌：中心的高度、相邻两张的间距、一张的宽和高
shop_y = 0.367                 # 商店
shop_pitch = 0.128
shop_width = 0.11
shop_height = 0.15
board_y = 0.55                 # 我方场面
board_pitch = 0.128
board_width = 0.11
board_height = 0.15
choice_y = 0.5                 # 弹出的 2~3 个选项（发现、黑暗之赐、三连、技能升级）
choice_pitch = 0.42
choice_width = 0.33
choice_height = 0.5
choice4_y = 0.45               # 弹出的 4 个选项（饰品商店；按截图校准过）
choice4_pitch = 0.254
choice4_width = 0.235
choice4_height = 0.34
hero_y = 0.47                  # 选英雄
hero_pitch = 0.36
hero_width = 0.27
hero_height = 0.46
# 按钮：[中心 x, 中心 y, 半径]；半径 0 表示还没校准、不画框
upgrade = [0.412, 0.175, 0.05]  # 升本
refresh = [0.588, 0.175, 0.05]  # 刷新
freeze = [0.646, 0.175, 0.05]   # 冻结
hero_power = [0.593, 0.78, 0.055]  # 英雄技能
core_marks = true              # 商店里的核心卡左上角画"核"字小徽章
core_color = "#ff8fc2"         # 徽章的颜色（粉红）
