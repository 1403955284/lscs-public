# lscs 本地配置模板。复制为 config.toml 后填写（config.toml 已加入 .gitignore，不会进入仓库）。

[llm]
enabled = true
provider = "deepseek"
model = "deepseek-flash"
base_url = ""                  # 留空表示 https://api.deepseek.com
api_key = ""                   # 你的 DeepSeek Key
# 快速建议：招募开始和每次刷新后各一次，2~3 秒出结果
thinking = "disabled"          # 请保持 disabled；思考交给下面的深度分析
timeout_seconds = 20
max_output_tokens = 1500
max_calls_per_game = 80        # 每局最多调用几次（快速、深度和选英雄一起算）
hero_advice = true             # 选英雄时也让 AI 推荐一个（每局 1 次，重随时再 1 次）
# 深度分析：每回合开始时和快速建议同时发出，开思考，约 20 秒（偶尔 1 分钟）出结果
deep_analysis = true           # false 关闭深度分析（每局大约省 5 毛到 1 块钱）
deep_thinking = "low"          # 思考强度：low 或 high（high 更慢）
deep_max_output_tokens = 16000
deep_timeout_seconds = 75

[overlay]
enabled = true                 # 游戏上的悬浮面板；false 只用终端（也可以用 lscs watch --no-overlay）
position = "right"             # 贴在炉石窗口的 right（右侧）、left（左侧）或 top（顶部）
opacity = 0.85                 # 不透明度，0.3~1.0
font_size = 0                  # 字号（像素）：0 表示按炉石窗口大小自动，或填 10~40
click_through = true           # 鼠标点击穿透面板，不影响游戏操作（只在 Windows 上有效）
